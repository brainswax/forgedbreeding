name: Publish Pages

on:
  push:
    branches: [main, master]
    paths:
      - "reports/**"
      - "profiles/**"
      - "scripts/publish_pages.py"
      - "requirements-pages.txt"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements-pages.txt

      - name: Build site
        run: |
          # Project site: https://<user>.github.io/forgedbreeding/
          python3 scripts/publish_pages.py --out _site --base-url /forgedbreeding/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
